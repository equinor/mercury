name: "Azure Login"
description: "Logs in to Azure via OIDC and reads a secret from the mercury Key Vault"

inputs:
  secret-name:
    description: "Name of the Key Vault secret to read"
    required: true
  client-id:
    description: "Azure AD application (client) ID"
    required: true
  tenant-id:
    description: "Azure AD tenant ID"
    required: true
  subscription-id:
    description: "Azure subscription ID"
    required: true

outputs:
  secret:
    description: "The Key Vault secret value (masked)"
    value: ${{ steps.keyvault.outputs.secret }}

runs:
  using: "composite"
  steps:
    - name: "Setup: Azure login"
      uses: azure/login@v2
      with:
        client-id: ${{ inputs.client-id }}
        tenant-id: ${{ inputs.tenant-id }}
        subscription-id: ${{ inputs.subscription-id }}

    - name: "Setup: read Key Vault secret"
      id: keyvault
      shell: bash
      run: |
        value=$(az keyvault secret show --vault-name mercury-kv --name "${{ inputs.secret-name }}" --query value -o tsv)

        while IFS= read -r line; do
          if [ -n "$line" ]; then echo "::add-mask::$line"; fi
        done <<< "$value"

        {
          echo "secret<<EOF"
          echo "$value"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"
