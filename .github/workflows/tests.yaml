name: "Tests"
on:
  workflow_call:
    secrets:
      LIBHG_PAT:
        description: "PAT for accessing libhg repository"
        required: true

permissions:
  contents: read
  packages: read

env:
  API_IMAGE: ghcr.io/equinor/mercury-api

jobs:
  test-api:
    runs-on: ubuntu-latest
    name: "Tests: API"
    steps:
      - name: "Setup: Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: "Setup: install mise"
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4

      - name: "Setup: Login to image registry"
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Setup: set up Docker Buildx"
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: "Setup: Build API test image"
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        env:
          DOCKER_BUILD_SUMMARY: false
        with:
          context: ./api
          target: development
          load: true
          tags: mercury-api-ci
          cache-from: type=registry,ref=${{ env.API_IMAGE }}:latest
          build-args: |
            LIBHG_VERSION=${{ vars.LIBHG_VERSION }}
          secrets: |
            libhg-pat=${{ secrets.LIBHG_PAT }}

      - name: "Run: Unit tests with python"
        run: mise run docker-pytest-ci -m unit

      - name: "Run: Integration tests with python"
        run: mise run docker-pytest-ci -m integration

  test-web:
    runs-on: ubuntu-latest
    name: "Tests: Web"
    steps:
      - name: "Setup: check out repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: "Setup: install mise"
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4

      - name: "Run: Tests with yarn"
        run: mise run test-web-unit
