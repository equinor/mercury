name: "On Pull Request"
on:
  pull_request:

jobs:
  linting-and-checks:
    permissions:
      contents: read
    uses: ./.github/workflows/linting-and-checks.yaml
  tests:
    permissions:
      contents: read
      packages: read
      id-token: write
    uses: ./.github/workflows/tests.yaml
    secrets: inherit
