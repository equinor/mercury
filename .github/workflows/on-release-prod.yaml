name: "Release new prod version"
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      release-tag:
        description: "release tag"
        required: true
        type: string

jobs:
  publish-release-image:
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/publish-images.yaml
    with:
      image-tags: ${{ inputs.release-tag }}
      appinsights-secret-name: APP-INSIGHTS-CON-STRING-PROD
    secrets: inherit

  deploy-prod-to-radix:
    needs: publish-release-image
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-to-radix.yaml
    with:
      image-tag: ${{ inputs.release-tag }}
      radix-environment: prod
