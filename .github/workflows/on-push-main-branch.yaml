name: "Push to main branch"
on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  linting-and-checks:
    permissions:
      contents: read
    uses: ./.github/workflows/linting-and-checks.yaml

  tests:
    permissions:
      contents: read
      packages: read
      id-token: write
    uses: ./.github/workflows/tests.yaml
    secrets: inherit

  release-dev:
    needs: [linting-and-checks, tests]
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/on-release-dev.yaml
    secrets: inherit

  release-please:
    runs-on: ubuntu-latest
    needs: [linting-and-checks, tests]
    permissions:
      contents: write
      issues: write
      id-token: write
      pull-requests: write
    steps:
      - name: "Setup: check out repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: "Setup Azure Login"
        id: keyvault
        uses: ./.github/actions/azure-login
        with:
          secret-name: APP-PRIVATE-KEY
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Generate token
        id: generate-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ steps.keyvault.outputs.secret }}

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          token: ${{ steps.generate-token.outputs.token }}
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

  release-prod:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/on-release-prod.yaml
    secrets: inherit
    with:
      release-tag: ${{ needs.release-please.outputs.tag_name }}
