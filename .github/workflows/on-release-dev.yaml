name: "Release new dev (latest) version"
on:
  workflow_dispatch:
  workflow_call:

jobs:
  publish-latest-image:
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/publish-images.yaml
    with:
      image-tags: latest
      appinsights-secret-name: APP-INSIGHTS-CON-STRING-DEV
    secrets: inherit

  deploy-dev-to-radix:
    needs: publish-latest-image
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-to-radix.yaml
    with:
      image-tag: latest
      radix-environment: dev
