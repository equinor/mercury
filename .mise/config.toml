[tools]
python = "3.13.18"
uv = "0.13.6"
node = "26"
pnpm = "12.16.1"
prek = "latest"

[env]
PROJECT_NAME = "{{ config_root | basename }}"
DOCKER_BUILDKIT = 1
KUBB_DISABLE_TELEMETRY = 1
_.file = ".env"
_.python.venv = { path = "api/.venv", create = true, uv_create_args = [
  "--prompt",
  "$PROJECT_NAME",
] }

[task_config]
includes = [".mise/tasks/*.toml"]

[settings.python]
uv_venv_auto = true

[settings.pipx]
uvx = true
